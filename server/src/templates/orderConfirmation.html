<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background:#f5f5f0;font-family:Inter,system-ui,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:40px auto;background:#fff;border:1px solid #e5e5e5;border-radius:8px;">
  <tr><td style="padding:32px 32px 0;text-align:center;">
    <h1 style="margin:0;font-size:20px;font-weight:600;color:#1a1a2e;">{{title}}</h1>
  </td></tr>
  <tr><td style="padding:24px 32px;">
    <p style="margin:0 0 16px;color:#444;font-size:15px;line-height:1.6;">Hi {{customerName}},</p>
    <p style="margin:0 0 24px;color:#444;font-size:15px;line-height:1.6;">{{message}}</p>
    <table width="100%" style="background:#f9f9f6;border-radius:6px;border:1px solid #eee;">
      <tr><td style="padding:16px 20px;">
        <p style="margin:0 0 8px;font-size:13px;color:#888;text-transform:uppercase;letter-spacing:0.5px;">Tracking Code</p>
        <p style="margin:0;font-size:22px;font-weight:700;color:#e8890c;letter-spacing:2px;">{{trackingCode}}</p>
      </td></tr>
      <tr><td style="padding:0 20px 16px;">
        <p style="margin:0 0 4px;font-size:13px;color:#888;">Total Amount</p>
        <p style="margin:0;font-size:18px;font-weight:600;color:#1a1a2e;">${{totalAmount}}</p>
      </td></tr>
      <tr><td style="padding:0 20px 16px;">
        <p style="margin:0 0 4px;font-size:13px;color:#888;">Payment Method</p>
        <p style="margin:0;font-size:14px;color:#1a1a2e;text-transform:capitalize;">{{paymentMethod}}</p>
      </td></tr>
    </table>
  </td></tr>
  <tr><td style="padding:16px 32px 32px;text-align:center;">
    <p style="margin:0;font-size:12px;color:#aaa;">Use your tracking code to check your order status anytime.</p>
  </td></tr>
</table>
</body></html>
