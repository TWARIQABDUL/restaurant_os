<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />

    <!-- The canvas's own font request, copied from project/Main.dc.html. TODO before launch:
         self-host these. A third-party render-blocking request on every page is a dependency the
         storefront does not need, and Google Fonts is one more origin to trust. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <title>Vendlyfy</title>
  </head>
  <body>
    <!-- A THIRD ENTRY, and the reason is the same one that made gallery.html a second: index.html loads
         src/main.jsx, which imports src/index.css — the legacy stylesheet 31 of the old pages still
         depend on. This document loads tokens.css and nothing else, which is what makes "no legacy CSS
         reachable" a fact about the new app rather than a hope.

         This is where Stage D's screens land, milestone by milestone. At cutover it replaces
         index.html and the legacy tree is deleted. -->
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
