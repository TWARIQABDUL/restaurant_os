services:
  # ------------------------------------------------------------
  # 1. The Backend API (Node.js)
  # ------------------------------------------------------------
  - type: web
    name: restaurant-os-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Link CORS to the frontend service automatically
      # CORS origin — must be the Vercel URL, e.g.
      # https://restaurant-os-liart-rho.vercel.app
      # Set by hand: the frontend is on Vercel, so there is no Render service to
      # resolve this from. Only Socket.io actually needs it — ordinary API calls
      # arrive via the Vercel rewrite and are same-origin from the browser's view.
      - key: CLIENT_URL
        sync: false
      
      # The following variables will show up as blank in your Render dashboard.
      # You must fill them in manually before the first deploy succeeds!
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      # SERVER ONLY — bypasses RLS. The backend authenticates with this, never
      # with the anon key (which is public and, since lockdown-anon.sql, has no
      # privileges). Must never be given a VITE_ prefix or set on the client.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # MoMo Variables
      #
      # These are per-environment, NOT constants — they were hardcoded to
      # sandbox, which meant a production deploy would send real customers
      # sandbox prompts, collect nothing, and still look like it worked (the
      # sandbox answers SUCCESSFUL regardless). src/config/env.js now refuses
      # to boot on NODE_ENV=production with a sandbox MoMo config.
      #
      # Live (Rwanda) values for reference:
      #   MOMO_ENVIRONMENT        production
      #   MOMO_BASE_URL           https://proxy.momoapi.mtn.com
      #   MOMO_TARGET_ENVIRONMENT mtnrwanda
      #   MOMO_CURRENCY           RWF
      - key: MOMO_ENVIRONMENT
        sync: false
      - key: MOMO_BASE_URL
        sync: false
      - key: MOMO_TARGET_ENVIRONMENT
        sync: false
      - key: MOMO_CURRENCY
        sync: false
      - key: MOMO_DEFAULT_COUNTRY_CODE
        value: 250
      # Set to "true" ONLY for a staging/soak deployment that is meant to run
      # against the MoMo sandbox. Leave unset for a real deployment — the boot
      # check then refuses to start on a sandbox config, which is the whole
      # point of it.
      - key: MOMO_ALLOW_SANDBOX
        sync: false
      - key: MOMO_COLLECTION_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_COLLECTION_API_USER
        sync: false
      - key: MOMO_COLLECTION_API_KEY
        sync: false
      - key: MOMO_DISBURSEMENT_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_DISBURSEMENT_API_USER
        sync: false
      - key: MOMO_DISBURSEMENT_API_KEY
        sync: false

  # ------------------------------------------------------------
  # 2. The NEW Backend API (milestone 30 cutover candidate)
  # ------------------------------------------------------------
  # server/src/api — the pg-only server (milestone 11), not the legacy one above. A SECOND service,
  # not a repoint of restaurant-os-api's startCommand, on purpose: it needs to serve real traffic
  # against the production Postgres and be validated before anything is switched over, with the
  # legacy service staying up as the instant rollback the whole time. Once validated, cutover is:
  # update client/vercel.json's /backend rewrite + CSP to THIS service's hostname, then (after one
  # full settlement cycle) retire restaurant-os-api.
  - type: web
    name: restaurant-os-api-new
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run api:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: CLIENT_URL
        sync: false

      # Milestone 30's freeze switch (middleware/writeFreeze.ts). Leave unset/off outside the actual
      # cutover window — flip to "on" to freeze writes while the final ETL run and report happen, then
      # back to "off" (or remove it) once DNS/the Vercel rewrite has moved. Takes effect without a
      # redeploy — Render's env var change is enough, since it's read live on every request.
      - key: WRITE_FREEZE
        value: 'off'

      # The APPLICATION role, never the owner's — same distinction server/db:up draws locally. Must
      # point at the production database the real ETL run writes into, not the dev/rehearsal one.
      - key: APP_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

      # Messaging (milestone 28) — see messaging-email-vendor in project memory for the decisions.
      - key: MESSAGING_EMAIL
        value: sendgrid
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Leave MESSAGING_SMS=none until the Twilio account is actually funded — see twilioTransport.ts.
      - key: MESSAGING_SMS
        value: none
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

      # Storage (milestone 22/26) — decided 2026-10-20, MinIO; see storage-vendor in project memory.
      - key: MEDIA_STORE
        value: minio
      - key: PRIVATE_STORE
        value: minio
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_PORT
        sync: false
      - key: MINIO_USE_SSL
        value: 'true'
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_MEDIA_BUCKET
        sync: false
      - key: MINIO_PRIVATE_BUCKET
        sync: false

      # Identity verification (milestone 26) — losing KYC_ENCRYPTION_KEY makes every stored document
      # unreadable. Must be the SAME key the real ETL run (or the live system before it) sealed
      # documents with — never generate a fresh one for this service.
      - key: KYC_ENCRYPTION_KEY
        sync: false
      - key: KYC_FINGERPRINT_PEPPER
        sync: false

      # MoMo — same live values as the legacy service's block above; both talk to the same provider
      # account, so these are not independent per-service secrets.
      - key: MOMO_ENVIRONMENT
        sync: false
      - key: MOMO_BASE_URL
        sync: false
      - key: MOMO_TARGET_ENVIRONMENT
        sync: false
      - key: MOMO_CURRENCY
        sync: false
      - key: MOMO_DEFAULT_COUNTRY_CODE
        value: 250
      - key: MOMO_COLLECTION_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_COLLECTION_API_USER
        sync: false
      - key: MOMO_COLLECTION_API_KEY
        sync: false
      - key: MOMO_DISBURSEMENT_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_DISBURSEMENT_API_USER
        sync: false
      - key: MOMO_DISBURSEMENT_API_KEY
        sync: false

      # Urubuto Pay (decided 2026-10-25, see payment-provider in project memory) — checkout
      # collections only. Disbursements stay on MoMo above; DISBURSEMENT_PROVIDER defaults to
      # momo when unset, so leaving it out here is deliberate, not an oversight.
      - key: URUBUTO_BASE_URL
        sync: false
      - key: URUBUTO_API_KEY
        sync: false
      - key: URUBUTO_MERCHANT_CODE
        sync: false
      - key: URUBUTO_SERVICE_CODE
        sync: false
      - key: URUBUTO_HTTP_TIMEOUT_MS
        value: 15000
      # Credentials THIS server issues to Urubuto Pay for the webhook handshake — generate fresh
      # for production, never reuse the sandbox values from server/.env (same reasoning as the
      # sandbox/live split documented in payment-provider.md).
      - key: URUBUTO_WEBHOOK_USERNAME
        sync: false
      - key: URUBUTO_WEBHOOK_PASSWORD_HASH
        sync: false
      - key: URUBUTO_JWT_SECRET
        sync: false
      - key: URUBUTO_WEBHOOK_TOKEN_TTL
        value: 24h

  # ------------------------------------------------------------
  # 3. The Frontend — NOT DEPLOYED HERE
  # ------------------------------------------------------------
  # The client is hosted on Vercel (restaurant-os-liart-rho.vercel.app), not
  # Render. Its config lives in client/vercel.json, which also carries the
  # /backend/* rewrite that proxies this API onto the Vercel origin so the
  # session cookie stays first-party.
  #
  # The static-site block that used to sit here was stale — it referenced a
  # "restaurant-os-client" Render service that does not exist, which is also
  # why CLIENT_URL above cannot be resolved fromService and must be set by hand
  # in the Render dashboard to the Vercel URL (it is the CORS origin for
  # Socket.io, which connects to this host directly).
