services:
  # ------------------------------------------------------------
  # 1. The Backend API (Node.js)
  # ------------------------------------------------------------
  - type: web
    name: restaurant-os-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Link CORS to the frontend service automatically
      - key: CLIENT_URL
        fromService:
          type: web
          name: restaurant-os-client
          envVarKey: RENDER_EXTERNAL_URL
      
      # The following variables will show up as blank in your Render dashboard.
      # You must fill them in manually before the first deploy succeeds!
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      
      # MoMo Variables
      - key: MOMO_ENVIRONMENT
        value: sandbox
      - key: MOMO_BASE_URL
        value: https://sandbox.momodeveloper.mtn.com
      - key: MOMO_TARGET_ENVIRONMENT
        value: sandbox
      - key: MOMO_CURRENCY
        value: EUR
      - key: MOMO_DEFAULT_COUNTRY_CODE
        value: 250
      - key: MOMO_COLLECTION_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_COLLECTION_API_USER
        sync: false
      - key: MOMO_COLLECTION_API_KEY
        sync: false
      - key: MOMO_DISBURSEMENT_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_DISBURSEMENT_API_USER
        sync: false
      - key: MOMO_DISBURSEMENT_API_KEY
        sync: false

  # ------------------------------------------------------------
  # 2. The Frontend (React/Vite)
  # ------------------------------------------------------------
  - type: web
    name: restaurant-os-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # React Router needs all unknown paths to serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Link API requests to the backend service automatically
      - key: VITE_API_URL
        fromService:
          type: web
          name: restaurant-os-api
          envVarKey: RENDER_EXTERNAL_URL
      
      # The following variables will show up as blank in your Render dashboard.
      # You must fill them in manually.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
